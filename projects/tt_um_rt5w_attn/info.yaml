# Tiny Tapeout project information (sky130A TTSKY26e analog template tt_analog_6x2_3v3, yaml_version 6)
project:
  title:        "RT5W analog attention head (QK^T + softmax, on-die SS-SGD)"
  author:       "RT5W authors (UT Austin ECE)"
  discord:      ""
  description:  "4x4 subthreshold attention head: PMOS 1T+C_W QK^T array, exponentiator/KCL softmax, 8-bit SAR readout, sign-sign trim"
  language:     "Analog"
  clock_hz:     20000000   # 20 MHz: worst unbuffered reg-to-reg estimate 39.8 ns at ss/125C/3.0V (synth/sta_ss.txt)

  # 6x2 analog, 3.3 V: 1014.76 x 225.76 um = 229.1k um^2 (tt-support-tools def/analog/tt_analog_6x2_3v3.def).
  # Owner decision 20 Nov 2026: move from 4x2 to 6x2 (4x2 was 114 % full before level shifters + top wiring).
  tiles: "6x2"

  analog_pins: 3          # ua[0..2], used in order from 0 (TT analog spec)
  uses_vapwr: true        # 3.3 V analog supply on VAPWR; 1.8 V digital on VDPWR

  # Must start with tt_um_ and should contain the GitHub username: replace RT5WUSER before submission.
  top_module:  "tt_um_rt5w_attn"

  source_files:
    - "project.v"        # interface of the hard macro (gds/, lef/)
    - "rt5w_digital.v"   # RTL of the hardened 1.8 V controller macro
    - "rt5w_ctrl.v"
    - "rt5w_hvif.v"      # RTL of the 3.3 V interface macro

pinout:
  # Inputs
  ui[0]: "SCK"
  ui[1]: "MOSI"
  ui[2]: "CS_N"
  ui[3]: "START"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "CODE[0]"
  uo[1]: "CODE[1]"
  uo[2]: "CODE[2]"
  uo[3]: "CODE[3]"
  uo[4]: "CODE[4]"
  uo[5]: "CODE[5]"
  uo[6]: "CODE[6]"
  uo[7]: "CODE[7]"

  # Bidirectional pins
  uio[0]: "MISO"
  uio[1]: "VALID"
  uio[2]: "BUSY"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "I_REF (bias inject / measure)"
  ua[1]: "V_B (log-sum-exp probe)"
  ua[2]: "V_W (weight write / read-back)"
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
