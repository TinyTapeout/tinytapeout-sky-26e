# Tiny Tapeout project information
project:
  title:        "PRYZM CORDIC-16"       # Project title
  author:       "Piotr Slupski"         # Your name
  discord:      ""                      # Your discord username (optional)
  description:  "A 16-bit four-function CORDIC engine: sin/cos, atan2, hypot, multiply, on a byte-serial port"  # One line description
  language:     "Verilog"
  # 20 MHz, not 50: at 50 ns the worst (slow, 100 C) corner has +24.7 ns of
  # setup slack and TNS 0; at 40 ns the same corner fails by 1.67 ns. Measured
  # by ./pdk/flow.sh, recorded in docs/evidence/README.md.
  clock_hz:     20000000

  # How many tiles your design occupies. A single tile is about 167x108 uM.
  # 2x2, not 1x2: the datapath needs 62,362 um2 once placed (1x2 provides
  # 36,072), and removing operations does not change that — the shared 18-bit
  # adder, arctangent operand mux and 34-bit accumulate path size the die.
  # A 320x202 um die fits the area but not the routing: 2,779 DRC violations
  # at 85.7% density. Density is a routing constraint, not just an area one.
  # The die measures 334.88 x 225.76 um, not the nominal 334 x 216: the extra
  # 9.76 um of height is the core area bought by lowering BOTTOM/TOP_MARGIN_MULT
  # from 4 to 3, which brings the met4 power straps inside the precheck's 10 um
  # die-edge rule. See docs/PRECHECK.md.
  tiles: "2x2"                          # Valid: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2

  # The top module name must start with "tt_um_". Keep it unique.
  top_module:  "tt_um_pryzm_cordic"

  # Source files, one per line, all under ./src
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "D0"
  ui[1]: "D1"
  ui[2]: "D2"
  ui[3]: "D3"
  ui[4]: "D4"
  ui[5]: "D5"
  ui[6]: "D6"
  ui[7]: "D7"

  # Outputs
  uo[0]: "Q0"
  uo[1]: "Q1"
  uo[2]: "Q2"
  uo[3]: "Q3"
  uo[4]: "Q4"
  uo[5]: "Q5"
  uo[6]: "Q6"
  uo[7]: "Q7"

  # Bidirectional pins
  uio[0]: "WR"
  uio[1]: "GO"
  uio[2]: "ACK"
  uio[3]: "OP0"
  uio[4]: "OP1"
  uio[5]: "SRST"
  uio[6]: "VALID"
  uio[7]: "BUSY"

# Do not change!
yaml_version: 6
