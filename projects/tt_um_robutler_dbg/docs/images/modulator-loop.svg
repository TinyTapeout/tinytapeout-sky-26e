<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker></defs><rect width="940" height="300" fill="#ffffff"/><text x="14" y="22" text-anchor="start" font-size="13" font-weight="bold" fill="#2d3748">First-order delta-sigma modulator (as wired on the tile)</text><rect x="20" y="110" width="130" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="85.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">input select</text><text x="85.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#4a5568">ua[3] or short</text><rect x="200" y="90" width="210" height="100" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="305.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">SC integrator</text><text x="305.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#4a5568">fully differential</text><text x="305.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#4a5568">CS 4, CF 16, CD 2 units</text><text x="305.0" y="178.0" text-anchor="middle" font-size="10.5" fill="#4a5568">outputs O1P, O1N</text><rect x="460" y="100" width="150" height="80" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="535.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">comparator</text><text x="535.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#4a5568">latched</text><text x="535.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#4a5568">INP = O1N, INN = O1P</text><rect x="660" y="100" width="120" height="80" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="720.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">bit flop</text><text x="720.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#4a5568">BIT, BITN</text><rect x="200" y="220" width="210" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="305.0" y="247.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">clocks</text><text x="305.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#4a5568">PH1, PH2, PH1D, PH2D from clk</text><rect x="460" y="220" width="150" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="535.0" y="247.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">bias, references</text><text x="535.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#4a5568">VCM about 0.9 V, VBN, VBP</text><path d="M150,140 L200,140" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="175.0" y="135.0" text-anchor="middle" font-size="10.5" fill="#2d3748">VIN</text><path d="M410,140 L460,140" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M610,140 L660,140" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M780,140 L900,140" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="900" y="132" text-anchor="end" font-size="10.5" fill="#2d3748">uo[3] bitstream</text><path d="M720,100 L720,60 L305,60 L305,90" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="510" y="54" text-anchor="middle" font-size="10.5" fill="#2d3748">BIT drives the CD bottom plates (DAC)</text><path d="M305,220 L305,190" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M535,220 L535,180" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/></svg>