<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker></defs><rect width="760" height="260" fill="#ffffff"/><text x="14" y="22" text-anchor="start" font-size="13" font-weight="bold" fill="#2d3748">Supply island (digital, own supply)</text><rect x="230" y="50" width="380" height="180" rx="8" fill="#fffaf0" stroke="#c05621" stroke-dasharray="6,4" stroke-width="1.4"/><text x="240" y="70" text-anchor="start" font-size="10"  fill="#c05621">island VDD = ua[2] (the source-measure unit supplies it and reads its current)</text><rect x="250" y="85" width="160" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="330.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">64-flop chain</text><text x="330.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#4a5568">at full placement density</text><rect x="430" y="85" width="160" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="510.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">64-inverter ring</text><text x="510.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#4a5568">divided by 16</text><rect x="250" y="160" width="340" height="50" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="420.0" y="182.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">output buffers</text><text x="420.0" y="197.0" text-anchor="middle" font-size="10.5" fill="#4a5568">island outputs to the core</text><rect x="20" y="95" width="160" height="70" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="100.0" y="127.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">input gating</text><text x="100.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#4a5568">ui[6] and the island</text><text x="100.0" y="155.0" text-anchor="middle" font-size="10.5" fill="#4a5568">enable bit</text><path d="M180,130 L250,115" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M330,145 L330,160" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M510,145 L510,160" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M590,185 L700,185" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="700" y="177" text-anchor="end" font-size="10.5" fill="#2d3748">to the core</text><text x="20" y="250" text-anchor="start" font-size="10"  fill="#2d3748">Nothing drives an unpowered island: its inputs stay gated off until ui[6] and the enable bit are set.</text></svg>