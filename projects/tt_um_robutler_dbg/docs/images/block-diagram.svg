<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="14" y="22" text-anchor="start" font-size="13" font-weight="bold" fill="#2d3748">tt_um_robutler_dbg</text><rect x="20" y="60" width="170" height="80" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="105.0" y="97.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">SPI register file</text><text x="105.0" y="112.0" text-anchor="middle" font-size="10.5" fill="#4a5568">mode 0, 24-bit frames</text><text x="105.0" y="125.0" text-anchor="middle" font-size="10.5" fill="#4a5568">ID 0xDB01</text><rect x="250" y="40" width="220" height="100" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="360.0" y="87.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">ring oscillators</text><text x="360.0" y="102.0" text-anchor="middle" font-size="10.5" fill="#4a5568">5 cell types, 4 wire layers</text><text x="360.0" y="115.0" text-anchor="middle" font-size="10.5" fill="#4a5568">+ reference, 2 path copies,</text><text x="360.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#4a5568">stacked-via ring, island ring</text><rect x="250" y="160" width="220" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="360.0" y="187.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">divider and counter</text><text x="360.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#4a5568">16 x 2^k, counted over GATE</text><rect x="250" y="240" width="220" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="360.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">LFSR + MISR, scan chain</text><text x="360.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#4a5568">at-speed logic check</text><rect x="530" y="40" width="210" height="100" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="635.0" y="87.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Kelvin structures</text><text x="635.0" y="102.0" text-anchor="middle" font-size="10.5" fill="#4a5568">via chains (licon .. via3)</text><text x="635.0" y="115.0" text-anchor="middle" font-size="10.5" fill="#4a5568">antenna pair, met1/met2 combs</text><rect x="530" y="160" width="210" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="635.0" y="187.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">probe mux</text><text x="635.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#4a5568">15 nodes to ua[5]</text><rect x="530" y="240" width="210" height="60" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="635.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">load bank, supply taps</text><text x="635.0" y="282.0" text-anchor="middle" font-size="10.5" fill="#4a5568">4 steps, IR drop</text><rect x="530" y="320" width="210" height="80" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="635.0" y="357.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">delta-sigma modulator</text><text x="635.0" y="372.0" text-anchor="middle" font-size="10.5" fill="#4a5568">integrator, comparator,</text><text x="635.0" y="385.0" text-anchor="middle" font-size="10.5" fill="#4a5568">clocks, bias, references</text><rect x="800" y="280" width="180" height="120" rx="6" fill="#eef4fb" stroke="#2b6cb0" stroke-width="1.4"/><text x="890.0" y="337.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">supply island</text><text x="890.0" y="352.0" text-anchor="middle" font-size="10.5" fill="#4a5568">own VDD on ua[2]</text><text x="890.0" y="365.0" text-anchor="middle" font-size="10.5" fill="#4a5568">64-flop chain</text><text x="890.0" y="378.0" text-anchor="middle" font-size="10.5" fill="#4a5568">64-inverter ring</text><text x="890.0" y="391.0" text-anchor="middle" font-size="10.5" fill="#4a5568">inputs gated by ui[6]</text><path d="M190,100 L250,100" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M190,120 L220,120 L220,270 L250,270" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M360,140 L360,160" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><path d="M470,190 L500,190 L500,410 L130,410 L130,140" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="300" y="405" text-anchor="middle" font-size="10.5" fill="#2d3748">COUNT</text><path d="M740,90 L985,90" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="985" y="80" text-anchor="end" font-size="10.5" fill="#2d3748">ua[0] force, ua[1] sense</text><path d="M740,190 L985,190" fill="none" stroke="#2d3748" stroke-width="1.3" marker-end="url(#a)"/><text x="985" y="182" text-anchor="end" font-size="10.5" fill="#2d3748">ua[5] probe</text><text x="530" y="425" text-anchor="start" font-size="10"  fill="#2d3748">ua[3] modulator input, ua[4] VCM; bitstream uo[3], phase uo[4], comparator uo[5]</text><text x="20" y="450" text-anchor="start" font-size="10"  fill="#2d3748">uo[1] selected ring / divider, uo[7] clk / 256, uo[6] echoes ui[7].</text></svg>