# Tiny Tapeout project information
project:
  title:        "8-Bit Parallel-Prefix Priority Arbiter"
  author:       "Krishna Saini, Kaushal H, K V Sai Charan, Hariprasad L,  Shylashree N, K B Ramesh, RV College of Engineering" # Add second student co-author if applicable
  discord:      ""
  description:  "Single-cycle 8-bit parallel-prefix priority arbiter with dynamic enable masking and 8-to-3 grant encoder"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_priority_arbiter_8bit"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "parallel_prefix_arbiter.v"
    - "grant_encoder_8to3.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "req[0] (highest priority)"
  ui[1]: "req[1]"
  ui[2]: "req[2]"
  ui[3]: "req[3]"
  ui[4]: "req[4]"
  ui[5]: "req[5]"
  ui[6]: "req[6]"
  ui[7]: "req[7] (lowest priority)"

  # Outputs
  uo[0]: "grant_oh[0]"
  uo[1]: "grant_oh[1]"
  uo[2]: "grant_oh[2]"
  uo[3]: "grant_oh[3]"
  uo[4]: "grant_oh[4]"
  uo[5]: "grant_oh[5]"
  uo[6]: "grant_oh[6]"
  uo[7]: "grant_oh[7]"

  # Bidirectional pins
  uio[0]: "enable_mask[0]"
  uio[1]: "enable_mask[1]"
  uio[2]: "enable_mask[2]"
  uio[3]: "enable_mask[3]"
  uio[4]: "enable_mask[4]"
  uio[5]: "enable_mask[5]"
  uio[6]: "enable_mask[6]"
  uio[7]: "enable_mask[7]"

# Do not change!
yaml_version: 6
