# Tiny Tapeout project information
project:
  title:        "tiny_nfc - ISO14443A NFC Type 2 tag (mixed-signal)"
  author:       "Rakesh"
  discord:      ""
  description:  "Semi-passive ISO/IEC 14443A / NFC Forum Type 2 tag: on-chip RF front end (clock recovery, pause detector, load-mod switch) + protocol core"
  language:     "Verilog + custom analog (std-cell AFE, poly-R / MIM-C macros)"
  clock_hz:     13560000

  tiles: "1x2"

  analog_pins: 2
  uses_vapwr: false

  top_module:  "tt_um_rakesh_tiny_nfc"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "MODE (0=RF, 1=emulation)"
  ui[1]: "PAUSE_IN (emulation)"
  ui[2]: "FDT_TRIM[0]"
  ui[3]: "FDT_TRIM[1]"
  ui[4]: "UID_CFG[0]"
  ui[5]: "UID_CFG[1]"
  ui[6]: "UID_CFG[2]"
  ui[7]: "UID_CFG[3]"

  # Outputs
  uo[0]: "LM_OUT (external MOSFET gate)"
  uo[1]: "CLK_MON (core clock / 2)"
  uo[2]: "PAUSE_MON"
  uo[3]: "RX_OK (toggle)"
  uo[4]: "RX_BAD (toggle)"
  uo[5]: "STATE[0]"
  uo[6]: "STATE[1]"
  uo[7]: "STATE[2]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "RF_IN (clamped antenna tap)"
  ua[1]: "LM (open-drain load modulation)"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
