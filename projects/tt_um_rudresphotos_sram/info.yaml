# Tiny Tapeout project information
project:
  title:        "SKY130 SRAM 32x8 (OpenRAM)"
  author:       "Rudr Bisht, Karthik Raj Palleboyina"
  discord:      ""
  description:  "256-bit single-port SRAM (32 words x 8 bits) made with OpenRAM, pins wired directly to the TT pins"
  language:     "Full Custom"
  clock_hz:     25000000

  tiles: "1x2"

  analog_pins: 0
  uses_vapwr: false

  top_module:  "tt_um_rudresphotos_sram"

  source_files:
    - "tt_um_rudresphotos_sram.v"

pinout:
  # Inputs
  ui[0]: "addr[0]"
  ui[1]: "addr[1]"
  ui[2]: "addr[2]"
  ui[3]: "addr[3]"
  ui[4]: "addr[4]"
  ui[5]: "web (write enable, active low)"
  ui[6]: "csb (chip select, active low)"
  ui[7]: "spare (keep low)"

  # Outputs
  uo[0]: "dout[0]"
  uo[1]: "dout[1]"
  uo[2]: "dout[2]"
  uo[3]: "dout[3]"
  uo[4]: "dout[4]"
  uo[5]: "dout[5]"
  uo[6]: "dout[6]"
  uo[7]: "dout[7]"

  # Bidirectional pins
  uio[0]: "din[0]"
  uio[1]: "din[1]"
  uio[2]: "din[2]"
  uio[3]: "din[3]"
  uio[4]: "din[4]"
  uio[5]: "din[5]"
  uio[6]: "din[6]"
  uio[7]: "din[7]"

  # Analog pins
  ua[0]: ""
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
