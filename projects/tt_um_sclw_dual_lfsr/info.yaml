# Tiny Tapeout project information
project:
  title:        "Dual Cross-Coupled LFSR"
  author:       "Lorenz Schwarz"
  discord:      ""
  description:  "Two 32-stage XNOR LFSRs with their own clocks; each one's length and feedback tap are chosen by the other. Lunetta-style sound generator."
  language:     "Verilog"
  clock_hz:     10000000  # system clock for input sampling; the LFSRs step on the external clocks CLK_A / CLK_B

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sclw_dual_lfsr"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "xlfsr.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CLK_A"
  ui[1]: "CLK_B"
  ui[2]: "HOLD_LEN_A"
  ui[3]: "HOLD_TAP_A"
  ui[4]: "HOLD_LEN_B"
  ui[5]: "HOLD_TAP_B"
  ui[6]: "REF"
  ui[7]: "DATA"

  # Outputs
  uo[0]: "OUT_A"
  uo[1]: "OUT_B"
  uo[2]: "OUT_A_XOR_B"
  uo[3]: "A_STAGE2"
  uo[4]: "A_STAGE5"
  uo[5]: "A_STAGE8"
  uo[6]: "A_STAGE11"
  uo[7]: "A_STAGE14"

  # Bidirectional pins
  uio[0]: "CFG_CLK"
  uio[1]: "LOAD"
  uio[2]: "A_STAGE17"
  uio[3]: "A_STAGE20"
  uio[4]: "A_STAGE23"
  uio[5]: "A_STAGE26"
  uio[6]: "A_STAGE29"
  uio[7]: "A_STAGE32"

# Do not change!
yaml_version: 6
