# Tiny Tapeout project information
project:
  title:        "tiny_kws: PDM-mic keyword spotter with streamed GRU"
  author:       "Rakesh Polasa"
  discord:      ""
  description:  "Always-on keyword spotting: PDM mic -> 16ch IIR filterbank -> int8 GRU, weights streamed from QSPI PSRAM Pmod"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x2"

  top_module:  "tt_um_rakesh_tiny_kws"

  source_files:
    - "project.v"
    - "kws_spi_slave.v"
    - "kws_frontend.v"
    - "kws_coef_rom.v"
    - "kws_qspi.v"
    - "kws_nn.v"
    - "kws_sreg.v"

pinout:
  # Inputs
  ui[0]: "PDM_DAT"
  ui[1]: "SPI_SCK"
  ui[2]: "SPI_MOSI"
  ui[3]: "SPI_CSn"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PDM_CLK"
  uo[1]: "SPI_MISO"
  uo[2]: "DETECT"
  uo[3]: "FRAME"
  uo[4]: "DET_CLASS0"
  uo[5]: "DET_CLASS1"
  uo[6]: "DET_CLASS2"
  uo[7]: "DET_CLASS3"

  # Bidirectional pins
  uio[0]: "QSPI_CS0 (flash)"
  uio[1]: "QSPI_SD0"
  uio[2]: "QSPI_SD1"
  uio[3]: "QSPI_SCK"
  uio[4]: "QSPI_SD2"
  uio[5]: "QSPI_SD3"
  uio[6]: "QSPI_CS1 (PSRAM A)"
  uio[7]: "QSPI_CS2 (PSRAM B)"

# Do not change!
yaml_version: 6
