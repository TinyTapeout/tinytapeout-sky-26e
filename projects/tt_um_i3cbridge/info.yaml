project:
  title:        "Minimal I3C target to I2C bridge"
  author:       "Vipul S, Shridatta M Hebbar, Shreevathsa Kuthethoor, Anay Katti, Shylashree N, RV College of Engineering"
  discord:      ""
  description:  "I3C SDR target that runs I2C transactions on a downstream bus via private writes and reads"
  language:     "Verilog"
  clock_hz:     25000000
  
  tiles: "1x1"

  top_module:  "tt_um_i3cbridge"

  source_files:
    - "project.v"
    - "sync2_edge.v"
    - "i3c_bus_cond.v"
    - "i3c_tgt.v"
    - "i3c_daa.v"
    - "cmd_ctrl.v"
    - "fifo4x8.v"
    - "timeout20.v"
    - "clkdiv.v"
    - "i2c_ctrl.v"

pinout:
  # Inputs
  ui[0]: ""
  ui[1]: "PID_INST[0]"
  ui[2]: "PID_INST[1]"
  ui[3]: "I2C_FAST"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "DBG_STATE[0]"
  uo[1]: "DBG_STATE[1]"
  uo[2]: "DBG_STATE[2]"
  uo[3]: "DBG_STATE[3]"
  uo[4]: "DA_VALID"
  uo[5]: "IRQ"
  uo[6]: "BUSY"
  uo[7]: "ERR"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: "I3C_SCL"
  uio[3]: "I3C_SDA"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "I2C_SCL"
  uio[7]: "I2C_SDA"

# Do not change!
yaml_version: 6
