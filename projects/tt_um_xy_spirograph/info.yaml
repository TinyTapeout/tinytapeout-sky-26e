# Tiny Tapeout project information
project:
  title: "XY Spirograph"
  author: "Luis Xavier Jauregui de la Rosa"
  discord: "astr0k_"
  description: "Draws four selectable patterns on an XY oscilloscope using two external 4-bit R-2R DACs."
  language: "Verilog"
  clock_hz: 64000
  tiles: "micro"
  top_module: "tt_um_xy_spirograph"
  source_files:
    - "project.v"

pinout:

  ui[0]: "Pattern select bit 0 (LSB)"
  ui[1]: "Pattern select bit 1 (MSB)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""


  uo[0]: "X DAC bit 0 (LSB)"
  uo[1]: "X DAC bit 1"
  uo[2]: "X DAC bit 2"
  uo[3]: "X DAC bit 3 (MSB)"
  uo[4]: "Y DAC bit 0 (LSB)"
  uo[5]: "Y DAC bit 1"
  uo[6]: "Y DAC bit 2"
  uo[7]: "Y DAC bit 3 (MSB)"


  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
