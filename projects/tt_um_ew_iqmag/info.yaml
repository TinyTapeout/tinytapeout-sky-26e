project:
  title: ASIC-1A Signed IQ Magnitude-Squared Accelerator
  author: "Kennan Lau"
  discord: ''
  description: Computes I squared plus Q squared from signed 8-bit I/Q samples
  language: Verilog
  clock_hz: 50000000
  tiles: 1x1
  top_module: tt_um_ew_iqmag
  source_files:
    - "project.v"
pinout:
  ui[0]: Signed sample bit 0
  ui[1]: Signed sample bit 1
  ui[2]: Signed sample bit 2
  ui[3]: Signed sample bit 3
  ui[4]: Signed sample bit 4
  ui[5]: Signed sample bit 5
  ui[6]: Signed sample bit 6
  ui[7]: Signed sample bit 7
  uo[0]: Selected power byte bit 0
  uo[1]: Selected power byte bit 1
  uo[2]: Selected power byte bit 2
  uo[3]: Selected power byte bit 3
  uo[4]: Selected power byte bit 4
  uo[5]: Selected power byte bit 5
  uo[6]: Selected power byte bit 6
  uo[7]: Selected power byte bit 7
  uio[0]: Load I command
  uio[1]: Load Q command
  uio[2]: Compute command
  uio[3]: Output byte select
  uio[4]: ''
  uio[5]: ''
  uio[6]: ''
  uio[7]: ''
yaml_version: 6
