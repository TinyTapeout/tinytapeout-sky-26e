# Tiny Tapeout project information
project:
  title:        "POLITE Mini"      # Project title
  author:       "Rev Silicon"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "2x2 Signed INT4 multiply-accumulate accelerator"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     66000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_polite_mini"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_polite_mini.sv"
    - "polite_ctrl.sv"
    - "polite_pe.sv"
    - "polite_dbg.sv"
    - "polite_outbuf.sv"
    - "polite_outmux.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"

  # Outputs
  uo[0]: "RESULT[0]"
  uo[1]: "RESULT[1]"
  uo[2]: "RESULT[2]"
  uo[3]: "RESULT[3]"
  uo[4]: "OVERFLOW"
  uo[5]: "ILLEGAL"
  uo[6]: "DUMP_MARKER"
  uo[7]: "DEBUG_MARKER"

  # Bidirectional pins
  uio[0]: "ARG[0]"
  uio[1]: "ARG[1]"
  uio[2]: "ARG[2]"
  uio[3]: "ARG[3]"
  uio[4]: "OPCODE[0]"
  uio[5]: "OPCODE[1]"
  uio[6]: "OPCODE[2]"
  uio[7]: "OPCODE[3]"

# Do not change!
yaml_version: 6

