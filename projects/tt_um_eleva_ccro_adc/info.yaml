project:
  title: "CCRO differential VCO ADC"
  author: "Eleva"
  discord: ""
  description: "15-stage differential current-controlled ring oscillator ADC with Sinc2 decimation and 16-bit SPI"
  language: "Analog"
  clock_hz: 20000000
  tiles: "1x2"
  analog_pins: 2
  uses_vapwr: false
  top_module: "tt_um_eleva_ccro_adc"
  source_files:
    - "project.v"
pinout:
  ui[0]: "OSR select, 0=128 and 1=256"
  ui[1]: "Debug select bit 0"
  ui[2]: "Debug select bit 1"
  ui[3]: "Bias select bit 0"
  ui[4]: "Bias select bit 1"
  ui[5]: "Clear wrap latch, active high"
  ui[6]: ""
  ui[7]: ""
  uo[0]: "N transition count bit 0, or P oscillator /64"
  uo[1]: "N transition count bit 1, or N oscillator /64"
  uo[2]: "N transition count bit 2"
  uo[3]: "N transition count bit 3"
  uo[4]: "P transition count bit 0"
  uo[5]: "P transition count bit 1"
  uo[6]: "P transition count bit 2"
  uo[7]: "P transition count bit 3"
  uio[0]: "SPI SDO"
  uio[1]: "SPI chip select, active low"
  uio[2]: "SPI clock"
  uio[3]: "Sticky wrap warning"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
  ua[0]: "Positive differential input"
